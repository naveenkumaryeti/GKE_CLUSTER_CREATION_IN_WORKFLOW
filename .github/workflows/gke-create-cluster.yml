name: GKE Cluster Create (PowerShell)

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        default: gke-cluster-in-workflow
      zone:
        default: asia-south1-a

env:
  PROJECT_ID: gke-cluster-creation-workflow
  CLUSTER_NAME: ${{ inputs.cluster_name }}
  ZONE: ${{ inputs.zone }}

jobs:
  create-gke-cluster:
    runs-on: windows-latest   # PowerShell is native here
    permissions:
      contents: read
      id-token: write         # needed for Workload Identity Federation (keyless auth)

    steps:
      # 1. Checkout (optional, needed if repo has manifests/scripts)
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Authenticate to GCP (Workload Identity Federation - no JSON key stored)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # 3. Install gcloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Everything below is PowerShell (pwsh), calling gcloud CLI
      - name: Set GCP project
        shell: pwsh
        run: |
          gcloud config set project $env:PROJECT_ID
          Write-Host "Project set to $env:PROJECT_ID"

      - name: Create GKE cluster (skip if exists)
        shell: pwsh
        run: |
          gcloud container clusters describe $env:CLUSTER_NAME --zone $env:ZONE 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cluster '$env:CLUSTER_NAME' already exists. Skipping creation."
          } else {
            Write-Host "Creating cluster '$env:CLUSTER_NAME' in zone '$env:ZONE'..."
            gcloud container clusters create $env:CLUSTER_NAME `
              --zone $env:ZONE `
              --num-nodes 2 `
              --machine-type e2-medium `
              --release-channel regular `
              --quiet
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Cluster creation failed."
              exit 1
            }
          }

      - name: Verify cluster was created
        shell: pwsh
        run: |
          $exists = gcloud container clusters list `
            --filter="name=$env:CLUSTER_NAME" `
            --format="value(name)"
          if ([string]::IsNullOrWhiteSpace($exists)) {
            Write-Error "Verification failed: cluster not found."
            exit 1
          } else {
            Write-Host "Verified: cluster '$exists' exists."
          }

      - name: Print complete cluster information
        shell: pwsh
        run: |
          Write-Host "===== FULL CLUSTER DETAILS ====="
          gcloud container clusters describe $env:CLUSTER_NAME `
            --zone $env:ZONE `
            --format="yaml"

          Write-Host "`n===== NODE POOLS ====="
          gcloud container node-pools list `
            --cluster $env:CLUSTER_NAME `
            --zone $env:ZONE

          Write-Host "`n===== CREDENTIALS FETCH (kubectl context) ====="
          gcloud components install gke-gcloud-auth-plugin --quiet
          $env:USE_GKE_GCLOUD_AUTH_PLUGIN = "True"
          gcloud container clusters get-credentials $env:CLUSTER_NAME --zone $env:ZONE
          kubectl cluster-info
          kubectl get nodes -o wide
